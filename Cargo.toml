[workspace]
resolver = "2"
members = [
  "crates/tokentree-core",
  "crates/tokentree-ledger",
  "crates/tokentree-claude",
  "crates/tokentree-otel",
  "apps/rust-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
hex = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal"] }
walkdir = "2.5"
