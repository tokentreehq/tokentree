name: Benchmarks
on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-matrix:
    name: Hook Latency Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        with:
          toolchain: 1.98.1
      - name: Run Hook Latency Benchmark
        run: cargo test --test hook_latency_benchmark -- --nocapture
